<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}estereograma.py{% endblock %}</title>
    <meta name="description" content="Portfólio e ferramenta interativa de geração de estereogramas (autostereograms, Magic Eye) em Python.">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="/">estereograma<span class="ext">.py</span></a>
        <nav>
            <a href="/" {% if request.url.path == "/" %}class="ativo"{% endif %}>início</a>
            <a href="/aprender" {% if request.url.path.startswith("/aprender") %}class="ativo"{% endif %}>aprender</a>
            <a href="/galeria" {% if request.url.path.startswith("/galeria") %}class="ativo"{% endif %}>galeria</a>
            <a href="/playground" {% if request.url.path == "/playground" %}class="ativo"{% endif %}>playground</a>
        </nav>
    </header>
    <main>
        {% block conteudo %}{% endblock %}
    </main>
    <footer>
        <p>feito em python — <a href="https://github.com" rel="noopener">código</a></p>
    </footer>
</body>
</html>
