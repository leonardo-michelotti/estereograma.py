<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}estereograma.py{% endblock %}</title>
    <meta name="description" content="{% block descricao %}Crie autostereogramas no navegador e aprenda a enxergar o que está escondido.{% endblock %}">
    <meta name="theme-color" content="#F2EFE6">
    <link rel="canonical" href="{{ canonical_url(request) }}">
    <meta property="og:site_name" content="estereograma.py">
    <meta property="og:type" content="website">
    <meta property="og:title" content="estereograma.py — laboratório óptico interativo">
    <meta property="og:description" content="Crie autostereogramas no navegador e aprenda a enxergar o que está escondido.">
    <meta property="og:url" content="{{ canonical_url(request) }}">
    <meta property="og:image" content="{{ absolute_url(request, '/static/img/v03/og-estereograma.png') }}">
    <meta property="og:image:width" content="1728">
    <meta property="og:image:height" content="909">
    <meta property="og:image:alt" content="estereograma.py — aprenda a enxergar o que está escondido">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="estereograma.py — laboratório óptico interativo">
    <meta name="twitter:description" content="Crie autostereogramas no navegador e aprenda a enxergar o que está escondido.">
    <meta name="twitter:image" content="{{ absolute_url(request, '/static/img/v03/og-estereograma.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/v03.css') }}">
    <script src="{{ url_for('static', path='/js/htmx-1.9.12.min.js') }}" defer></script>
</head>
<body class="v03 {% block body_class %}{% endblock %}">
    <header class="site-header">
        <a class="logo" href="/" aria-label="estereograma.py — início">estereograma<span class="ext">.py</span></a>
        <nav aria-label="Navegação principal">
            <a href="/studio" {% if request.url.path == "/studio" %}class="ativo" aria-current="page"{% endif %}>Estúdio</a>
            <a href="/como-ver" {% if request.url.path == "/como-ver" %}class="ativo" aria-current="page"{% endif %}>Como ver</a>
            <a href="/#obra">Obra</a>
        </nav>
        <a class="header-cta" href="/studio">Criar agora</a>
    </header>
    <main class="{% block main_class %}{% endblock %}">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="site-footer">
        <span>estereograma.py · laboratório óptico interativo</span>
        <a href="https://github.com/leonardo-michelotti/estereograma.py" rel="noopener noreferrer">código-fonte ↗</a>
    </footer>
</body>
</html>
