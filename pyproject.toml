[project]
name = "estereograma"
version = "0.3.0"
description = "Laboratório óptico interativo para criar e aprender autostereogramas"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow==12.3.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.28",
    "pytest>=8.0",
    "ruff==0.16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
