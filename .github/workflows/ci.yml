name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        env:
          ESTEREOGRAMA_BUILD_CYTHON: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify compiled core
        env:
          ESTEREOGRAMA_EXPECT_COMPILED: "1"
        run: python -m pytest -q tests/test_stereogram_v2.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v

      - name: Test pure-Python fallback
        env:
          ESTEREOGRAMA_V2_FORCE_PYTHON: "1"
        run: pytest -q tests/test_stereogram_v2.py tests/test_benchmarks.py

  container:
    name: Container · Cython smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --tag estereograma:ci .

      - name: Verify lean runtime and compiled core
        run: |
          docker run --rm --entrypoint sh estereograma:ci -c '! command -v gcc'
          docker run --rm estereograma:ci python -c "import importlib.util; from app.stereogram.generator_v2 import ENGINE_IMPLEMENTATION_V2; assert importlib.util.find_spec('Cython') is None; assert ENGINE_IMPLEMENTATION_V2 == 'cython'"

      - name: Start container
        run: docker run --detach --name estereograma-ci --publish 127.0.0.1:18000:8000 estereograma:ci

      - name: Wait for healthcheck
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz --output /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify health payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/health.json").read_text())
          assert payload == {
              "status": "ok",
              "engine_version": "v2.0",
              "engine_implementation": "cython",
          }
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs estereograma-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force estereograma-ci || true
