name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        env:
          ESTEREOGRAMA_BUILD_CYTHON: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify compiled core
        env:
          ESTEREOGRAMA_EXPECT_COMPILED: "1"
        run: python -m pytest -q tests/test_stereogram_v2.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v

      - name: Test pure-Python fallback
        env:
          ESTEREOGRAMA_V2_FORCE_PYTHON: "1"
        run: pytest -q tests/test_stereogram_v2.py tests/test_benchmarks.py
