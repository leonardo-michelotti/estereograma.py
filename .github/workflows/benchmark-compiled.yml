name: Benchmark Engine V2 · Compilado

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Medições por caso
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "15"
          - "20"

permissions:
  contents: read

jobs:
  benchmark:
    name: Linux · Cython · ${{ inputs.repeat }} repetições
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install compiled package
        env:
          ESTEREOGRAMA_BUILD_CYTHON: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify clean compiled source
        run: |
          git diff --quiet
          git diff --cached --quiet
          python -c "from app.stereogram.generator_v2 import ENGINE_IMPLEMENTATION_V2; assert ENGINE_IMPLEMENTATION_V2 == 'cython'"

      - name: Collect canonical benchmark
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.run \
            --engine v2 \
            --suite canonical \
            --repeat "${{ inputs.repeat }}" \
            --warmup 3 \
            --power ac \
            --workload dedicated \
            --output benchmark-artifacts/compiled.jsonl

      - name: Derive report
        id: report
        run: |
          set +e
          python -m benchmarks.report \
            benchmark-artifacts/compiled.jsonl \
            --output benchmark-artifacts/compiled.md
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload raw data and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiled-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce statistical gates
        if: steps.report.outputs.status != '0'
        run: |
          echo "Benchmark reprovado; consulte o relatório no artefato."
          exit 1
